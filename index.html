<title>ריענון בטיחות חשמל מ"ג</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: control-room console. Chapter rail on the right (RTL), one lesson card at a time, amber = live/HV warning. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15202b; --muted:#566373; --line:#d5dbe2;
  --accent:#e8a200; --accent-ink:#1a1400; --steel:#1f3a56; --steel-ink:#ffffff;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --bad:#b3261e; --bad-bg:#fbe7e5; --soft:#f6f8fa;
  --f-display:"Rubik","Heebo",system-ui,sans-serif; --f-body:"Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17212c; --ink:#e7edf3; --muted:#9aa8b6; --line:#2a3846;
  --accent:#f2b324; --accent-ink:#1a1400; --steel:#2c4f73; --steel-ink:#ffffff;
  --ok:#5cc58b; --ok-bg:#15301f; --bad:#ff8a80; --bad-bg:#3a1a18; --soft:#1c2834; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17212c; --ink:#e7edf3; --muted:#9aa8b6; --line:#2a3846;
  --accent:#f2b324; --accent-ink:#1a1400; --steel:#2c4f73; --steel-ink:#ffffff;
  --ok:#5cc58b; --ok-bg:#15301f; --bad:#ff8a80; --bad-bg:#3a1a18; --soft:#1c2834; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sign{width:46px;height:46px;flex:none}
header.top h1{font-family:var(--f-display);font-size:1.45rem;margin:0;line-height:1.2;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:.9rem}
.grow{flex:1;min-width:0}
.overall{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:180px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
nav.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
nav.rail button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:.95rem}
nav.rail button:hover{background:var(--soft)}
nav.rail button[aria-current="true"]{background:var(--steel);color:var(--steel-ink)}
nav.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--f-display);font-weight:700;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.8rem;flex:none;font-variant-numeric:tabular-nums}
.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
nav.rail .score{margin-inline-start:auto;font-size:.8rem;opacity:.8;font-variant-numeric:tabular-nums}
nav.rail hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
main.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.stage-head{background:var(--steel);color:var(--steel-ink);padding:14px 22px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.stage-head .eyebrow{font-size:.75rem;letter-spacing:.06em;opacity:.8}
.stage-head h2{font-family:var(--f-display);margin:0;font-size:1.3rem;flex:1;min-width:0;text-wrap:balance}
.stage-head .count{font-size:.85rem;opacity:.85;font-variant-numeric:tabular-nums}
.slide{padding:22px 24px 8px;min-height:340px}
.slide h3{font-family:var(--f-display);font-size:1.25rem;margin:0 0 12px;text-wrap:balance}
.slide ul{margin:0;padding-inline-start:1.2em;display:grid;gap:8px;max-width:72ch}
.slide li::marker{color:var(--accent)}
.slide p{max-width:72ch;margin:0 0 10px}
.callout{margin-top:16px;border-inline-start:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:4px;max-width:72ch}
.callout b{font-family:var(--f-display)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
th,td{border:1px solid var(--line);padding:6px 12px;text-align:center}
th{background:var(--soft);font-weight:700}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex:none;font-size:.8rem;margin-top:2px}
.links a{color:var(--steel);font-weight:500}
:root[data-theme="dark"] .links a{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .links a{color:var(--accent)}}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 24px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.btn{font:inherit;font-weight:700;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.q{padding:22px 24px 8px}
.q .qn{color:var(--muted);font-size:.85rem}
.q h3{font-family:var(--f-display);font-size:1.15rem;margin:4px 0 14px;max-width:70ch}
.opts{display:grid;gap:8px;max-width:72ch}
.opt{all:unset;box-sizing:border-box;border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not([aria-disabled="true"]){border-color:var(--steel)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[aria-disabled="true"]{cursor:default}
.fb{margin-top:14px;padding:10px 14px;border-radius:6px;max-width:72ch}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb span{color:var(--ink)}
.center{padding:28px 24px;display:grid;gap:14px;justify-items:start}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
label{font-weight:500}
input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);width:min(360px,100%)}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
canvas#cert{width:100%;max-width:760px;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.9rem}
.grid9{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;width:100%}
.grid9 div{border:1px solid var(--line);border-radius:7px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.grid9 b{font-variant-numeric:tabular-nums}
svg.diagram{max-width:100%;height:auto;display:block;direction:ltr}
.split{display:grid;gap:18px}
@media (min-width:1100px){.split.has-fig{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
figure.fig{margin:0;display:grid;gap:6px;min-width:0}
figure.fig img{border-radius:6px;border:1px solid var(--line);background:#fff;display:block;max-height:420px;object-fit:contain;width:100%}
figure.fig .svgbox{border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:12px;overflow-x:auto}
figure.fig figcaption{font-size:.82rem;color:var(--muted)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  header.top .grow{flex-basis:calc(100% - 60px)} .overall{min-width:0;width:100%}
  nav.rail{position:static;display:flex;overflow-x:auto;gap:4px}
  nav.rail button{width:auto;flex:none;padding:7px 9px}
  nav.rail .lbl,nav.rail .score,nav.rail hr{display:none}
  .slide,.q{padding:18px 16px 6px}.foot{padding:12px 16px 16px}.stage-head{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <svg class="sign" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 96 90H4Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M55 30 38 60h13l-6 22 19-32H51z" fill="var(--ink)"/></svg>
    <div class="grow">
      <h1>ריענון בטיחות בחשמל: מתח נמוך ומתח גבוה</h1>
      <div class="sub">לומדה לחשמלאים העובדים במתקני מתח גבוה · 9 פרקים · בוחן בסוף כל פרק</div>
    </div>
    <div class="overall"><span id="ovtxt">התקדמות: 0 מתוך 9 פרקים</span><div class="bar"><i id="ovbar"></i></div></div>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="פרקי הלומדה"></nav>
    <main class="stage" id="stage" aria-live="polite"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

 {"h": "מאיפה הגיע סקר Arc Flash", "steps": ["<b>1979:</b> המהדורה הראשונה של NFPA 70E עוסקת בבטיחות חשמל בעבודה, בעיקר בנהלים.", "<b>תחילת שנות ה-80:</b> המחקר הראשון על כוויות קשת מראה שהן חלק נכבד מהפגיעות בתקלות חשמל. המודל התיאורטי שלו לא הסביר היטב חשיפה של אדם שעומד מול דלת לוח פתוחה, ולכן נדרש מודל ניסויי.", "<b>1995:</b> נוספים ל-NFPA 70E מושגי גבולות הגישה וגבול הקשת.", "<b>2000:</b> לראשונה טבלאות לבחירת ביגוד וציוד מגן לפי רמת סיכון (HRC).", "<b>2002:</b> IEEE 1584 מפרסם מודל ניסויי לחישוב אנרגיית הקשת, שהופך לסטנדרט בתעשייה.", "<b>2015:</b> קטגוריות HRC מוחלפות בקטגוריות Arc Flash PPE, וקטגוריה 0 מוסרת.", "<b>2018:</b> IEEE 1584 מתעדכן על בסיס סדרת ניסויים נרחבת של IEEE ו-NFPA."]},
 {"h": "שלושה מושגים בסקר Arc Flash", "p": "הסקר הופך את הסיכון מלא ידוע לנתון מדיד, לכל לוח ולכל נקודת עבודה.", "table": {"head": ["מושג", "מה הוא אומר", "על מה הוא משפיע"], "rows": [["אנרגיית פגיעה (Incident Energy)", "האנרגיה התרמית שמגיעה לפני ולגוף העובד במרחק העבודה, ב-cal/cm²", "בחירת ציוד המגן"], ["גבול הקשת (Arc Flash Boundary)", "המרחק שבו האנרגיה יורדת ל-1.2 cal/cm², סף כוויה מדרגה שנייה", "אסור להיכנס לתחומו בלי ציוד מגן מתאים"], ["גבולות התחשמלות (Shock Boundary)", "נקבעים לפי מתח העבודה ולפי תקנות החשמל", "מרחקי גישה לחלקים חיים"]]}, "c": "<b>גבולות ההתחשמלות תלויים במתח. גבול הקשת תלוי בזרם התקלה ובזמן הניתוק של ההגנות.</b> לכן במתקן אחד גבול הקשת יכול להיות גדול בהרבה ממרחקי ההתחשמלות. וחשוב: סקר Arc Flash אינו היתר לעבודה במתח חי."},
 {"h": "מי קובע מה: התקן, נוהל העבודה והחוק", "table": {"head": ["מקור", "תפקיד", "מה ממנו נגזר"], "rows": [["IEEE 1584-2018", "מדריך לחישוב הנדסי: מודלים, נוסחאות ומקדמים לחישוב זרם הקשת, האנרגיה וגבול הקשת", "תוצאות החישוב לכל לוח (בתחום 208V עד 15kV)"], ["NFPA 70E", "תקן בטיחות בעבודה בחשמל: נהלים, תיחום אזורי סיכון, הדרכה ובחירת ציוד מגן לפי ניתוח סיכונים", "נוהלי העבודה וציוד המגן"], ["חוק החשמל ותקנותיו, פקודת הבטיחות בעבודה", "הדין המחייב בישראל", "דרישות החוק המקומי תמיד גוברות"]]}, "c": "התקנים האמריקאיים הם כלי הנדסי מקובל. האחריות המקצועית והחובה החוקית נקבעות לפי הדין המקומי ונהלי הארגון."},
 {"h": "תהליך ביצוע סקר Arc Flash", "steps": ["<b>איסוף נתונים:</b> תרשים חד קווי, מקורות הזנה (רשת, שנאים, גנרטורים, אל-פסק), כבלים ופסי צבירה, מפסקים וממסרים.", "<b>אימות בשטח:</b> תוכניות לא תמיד מעודכנות. מצלמים את כיוון ההגנות בפועל (פונקציות L, S, I, G) ומודדים אורכים וחתכים.", "<b>מצבי הפעלה:</b> הזנה מהרשת, מגנרטור, שנאים במקביל, כל תצורה אפשרית.", "<b>זרם קצר תלת מופעי</b> בכל לוח, מחושב או נמדד.", "<b>נתוני הלוח:</b> תצורת פסי הצבירה, המרווח ביניהם, מידות המארז ומרחק העבודה.", "<b>זרם הקשת:</b> מחשבים זרם קשת מרבי ומזערי לפי מקדמי התקן.", "<b>זמן הניתוק:</b> מציבים את זרם הקשת על עקומת ההגנה שבמעלה הזרם. זה השלב הקריטי.", "<b>אנרגיה וגבול קשת:</b> מחשבים את האנרגיה (cal/cm²) ואת גבול הקשת, ומפיקים שלט לכל לוח."]},
 {"h": "זרם קצר נמוך יכול להיות מסוכן יותר", "p": "האינטואיציה אומרת שזרם קצר גבוה מסוכן יותר. בפועל, זרם קצר נמוך עלול להיות מתחת לסף הניתוק המיידי של ההגנה, ואז הקשת נמשכת הרבה יותר זמן.", "table": {"head": ["", "הזנה מרבית מהרשת", "הזנה מזערית (גנרטור)"], "rows": [["זרם קצר (דוגמה)", "45kA", "12kA"], ["תגובת ההגנה", "ניתוק מיידי תוך כ-50ms", "מתחת לסף המיידי, ניתוק אחרי כ-1.2s"], ["אנרגיית הקשת", "נמוכה יחסית בזכות הניתוק המהיר", "מזנקת: התרחיש המחמיר במתקן"]]}, "c": "<b>הסקר חייב לבדוק את כל תצורות ההפעלה</b>, כולל עבודה מגנרטור ושנאים במקביל. השלט על הלוח נקבע לפי התרחיש הגרוע ביותר."},
 {"h": "מבנה הלוח ומרחק העבודה", "p": "IEEE 1584-2018 מגדיר חמש תצורות של פסי צבירה. התצורה קובעת לאן הקשת נדחפת וכמה אנרגיה מגיעה לעובד.", "table": {"head": ["תצורה", "תיאור", "משמעות לעובד"], "rows": [["VCB", "פסים אנכיים בתוך מארז", "הקשת מתפשטת לאורך המוליכים ומטה"], ["VCBB", "פסים אנכיים במארז, מסתיימים במחסום מבודד", "הקשת נדחפת קדימה, לכיוון העובד"], ["HCB", "פסים אופקיים במארז, מכוונים אל הפתח", "אנרגיית הפגיעה עלולה להיות גבוהה במיוחד"], ["VOA / HOA", "פסים אנכיים או אופקיים באוויר פתוח", "החום מתפזר לכל הכיוונים, בלי החזר מדפנות"]]}, "c": "<b>מרחק עבודה</b> הוא המרחק בין מוקד הקשת לפנים ולגוף של העובד. ערכים מקובלים בתקן: כ-455 מ\"מ ללוחות מ\"נ קטנים, כ-610 מ\"מ למערכות מיתוג מ\"נ, וכ-910 מ\"מ למערכות מיתוג מ\"ג. מרווח הפסים ומידות המארז משפיעים גם הם על התוצאה."},
 {"h": "זרם הקשת קובע את זמן הניתוק", "b": ["זרם הקשת תמיד נמוך מזרם הקצר המלא (Bolted Fault), בגלל עכבת הקשת עצמה. לכן בודקים את זמן הניתוק על עקומת ההגנה <b>בזרם הקשת</b>, ולא בזרם הקצר.", "הקשת אינה יציבה, ולכן התקן דורש חישוב נוסף <b>בזרם קשת מופחת</b> (לפי מקדם תיקון שתלוי במתח ובתצורה). זרם נמוך יותר עלול להאריך מאוד את זמן ההגנה.", "הסקר משווה בין שני החישובים ובוחר את האנרגיה הגבוהה מביניהם. רמת המיגון נקבעת לפי התרחיש המחמיר."], "table": {"head": ["דוגמת החישוב בתקן", "ערך"], "rows": [["מתח מערכת", "0.48kV"], ["זרם קצר תלת מופעי", "45kA"], ["מרווח בין מוליכים / תצורה", "32 מ\"מ / VCB"], ["מרחק עבודה", "609.6 מ\"מ"], ["זרם קשת מחושב", "28.8kA"], ["משך הקשת מעקומת ההגנה", "61.3ms"], ["אנרגיית פגיעה", "11.6 J/cm², כלומר כ-2.8 cal/cm²"]]}},
 {"h": "דוגמה מסקר: השפעת זמן הניתוק", "p": "לוח חלוקה משני במ\"נ, 630A: מתח 400V, זרם קצר 10.5kA, תצורה VCB, מרווח פסים 25 מ\"מ, מרחק עבודה 457 מ\"מ.", "table": {"head": ["", "זרם קשת מחושב", "זרם קשת מזערי"], "rows": [["זרם הקשת", "7.79kA", "6.45kA"], ["זמן ניתוק (לפי היצרן)", "50ms", "250ms"], ["אנרגיית פגיעה", "0.84 cal/cm²", "3.67 cal/cm²"], ["גבול קשת", "365 מ\"מ", "920 מ\"מ"]]}, "c": "ירידה של כ-17% בזרם הקשת הובילה לזמן ניתוק ארוך פי 5, לאנרגיה גבוהה פי 4 ולגבול קשת כמעט פי 2.5. <b>קיצור זמן התגובה של המפסק בכיוון הגנות יכול להקטין מאוד את האנרגיה</b>, אבל כל שינוי כזה מחייב בדיקה הנדסית ובדיקת סלקטיביות."},
 {"h": "שלט Arc Flash על הלוח", "b": ["לפי NEC 2026 (סעיף 110.16) השלט כולל: מתח נומינלי, גבול הקשת, אנרגיית הפגיעה הזמינה <b>או</b> רמת ציוד המגן המזערית, ותאריך ביצוע הסקר.", "במהדורת 2026 הוסר סף 1000A: כל ציוד הזנה וחלוקה (למעט בדירות מגורים) צריך שלט, גם לוחות קטנים.", "הערכים בשלט נכונים רק ללוח שנבדק ולתצורת ההפעלה שנבדקה. אי אפשר להעתיק אותם ללוח אחר.", "שינוי במתקן (שנאי חדש, כיוון הגנות, מקור הזנה נוסף) עלול לשנות את התוצאה ומחייב עדכון הסקר. NFPA 70E דורש לבחון את הסקר מחדש לפחות כל 5 שנים."]},
 {h:"היררכיית אמצעי הבקרה", svg:"hoc", b:["הדרך היעילה ביותר להגן מקשת ומהתחשמלות היא לבטל את הסיכון: לעבוד במתקן מנותק, נעול ומוארק.","כשאי אפשר, מפחיתים: הגבלת זרם, מיתוג מרחוק, ניתוק מהיר.","אמצעים הנדסיים ומנהליים באים אחר כך.","ציוד מגן אישי נמצא בתחתית: הוא מגן רק כשכל השאר נכשל."]},
 {h:"אחריות העובד", b:["להימנע מעבודה בלוחות מחושמלים. אם חייבים, לעבוד לפי תקנות העבודה במתקן חי ובקרבתו ולפי הנהלים הפנימיים.","לזהות בוודאות את הלוח שהופסק, להכיר את כל מקורות ההזנה, יציאות החירום ואמצעי החילוץ.","לסלק סיכונים סביבתיים, לדאוג לתאורה נאותה ולקרוא את שלטי האזהרה.","לבדוק חזותית כלים וציוד מגן, ולא לעבוד עם חפצים בכיס החולצה או תלויים על הצוואר.","ריכוז מלא: בלי טלפון נייד, ולא לעבוד בלחץ או בעייפות."]},
 {h:"הערכת סיכונים והפחתת הסיכון", b:["הערכת סיכונים: זיהוי שיטתי של גורמי הסיכון, כולל גודל המפסקים, סוג ההגנות, תצורת המערכת ומבנה הלוחות.","תוכנית עבודה ייעודית הכוללת אמצעי בטיחות, גבולות עבודה, סדר פעולות, נעילה ותיוג, שמות המורשים ושרטוט חד קווי.","גבול הקשת (Arc Flash Boundary): המרחק שבו אנרגיית הקשת עלולה לגרום לכוויה מדרגה שנייה. מעבר לו מותרים רק עובדים עם ציוד מגן מתאים.","מיתוג מרחוק ככל האפשר, במיוחד אחרי שינויים במתקן.","כיוון הגנות לניתוק מהיר יותר: זמן קשת קצר יותר פירושו פחות אנרגיה."], img:[["arc_limit","הגבלת זרם הקצר מקטינה את אנרגיית הקשת (מתוך מבחני קשת)"]], c:"<b>ציוד מגן אישי הוא שכבת ההגנה האחרונה.</b> הוא נבחר לפי עוצמת הקשת הצפויה (לפי NFPA 70E ו-IEC 61482) ולא מחליף תכנון, ניתוק ונעילה."},
 {h:"קטגוריות ציוד מגן בפני קשת", b:["הקטגוריה נקבעת לפי אנרגיית הקשת הצפויה (cal/cm²) במקום העבודה.","קטגוריה 1: לפחות 4 cal/cm². ביגוד עמיד קשת, מגן פנים, כפפות עור, משקפיים ומגני שמיעה.","קטגוריה 2: לפחות 8 cal/cm². מוסיפים כיסוי ראש (בלקלווה).","קטגוריות 3 ו-4: לפחות 25 ו-40 cal/cm². חליפת קשת מלאה עם ברדס.","את הקטגוריה קובעים בהערכת הסיכונים ובתוכנית העבודה, לא בשטח."], img:[["ppe_cat","ארבע קטגוריות ציוד המגן לפי NFPA 70E"]]},
 {"h": "קשת במתח גבוה: אמצעים הנדסיים", "b": ["במ\"ג ההגנות במעלה הזרם מדורגות בזמן, ולכן זמן הניתוק ארוך יחסית והאנרגיה עלולה להגיע לעשרות cal/cm². IEEE 1584-2018 מכסה עד 15kV. מעל זה משתמשים בשיטות חישוב אחרות.", "<b>לוח עמיד קשת</b> (סיווג IAC לפי IEC 62271-200, למשל AFLR): מגן על האדם שעומד מולו רק כשכל הדלתות סגורות והכיסויים במקומם. פתיחת דלת מבטלת את ההגנה.", "<b>ממסר גילוי קשת</b> (חיישני אור יחד עם זרם): מזהה קשת במילי-שניות בודדות ומנתק מהר בהרבה מהגנת זרם יתר רגילה.", "<b>מצב תחזוקה (Maintenance Mode):</b> כיוון הגנה מהיר זמני בזמן עבודה, שמחזירים לכיוון הרגיל בסיום.", "<b>מיתוג והוצאת עגלה מרחוק</b>, מחוץ לגבול הקשת.", "ניתוק, נעילה, בדיקת העדר מתח והארקה עדיין קודמים לכל אלה: ציוד מגן אינו תחליף לניתוק המתח."]},
 {"h": "עדכוני תקינה אחרונים", "table": {"head": ["תקן", "מה השתנה"], "rows": [["IEEE 1584-2018", "החליף את מודל 2002: חמש תצורות פסי צבירה, חישוב בזרם מופחת והשפעת מידות המארז"], ["NFPA 70E-2027", "כשנדרש היתר עבודה במתח חי עם ציוד מגן, חייב להיות נוכח אדם נוסף שהוכשר לתגובה בחירום, מחוץ לגבול הקשת או לתחום הגישה המוגבלת (הגדול מביניהם)"], ["NFPA 70E-2027", "הצהרת תאימות עצמית של הספק לביגוד מגן כבר אינה מספיקה. נדרשת בדיקה במעבדה מוסמכת במסגרת מערכת איכות, או הסמכה של גוף שלישי"], ["NEC 2026, סעיף 110.16", "הוסר סף 1000A לשלט Arc Flash, ועודכנו הנתונים שחייבים להופיע בשלט"]]}, "c": "תחולת התקנים האלה בישראל נקבעת לפי הדין ונוהלי הארגון. הם מראים לאן הולכת התעשייה."}
]},
{t:"התחשמלות, מתח מגע ומתח צעד", s:[
 {h:"התחשמלות", b:["התחשמלות היא מעבר זרם דרך גוף האדם.","החומרה תלויה בעוצמת הזרם, במשך הזמן ובמסלול הזרם בגוף (מסלול דרך הלב מסוכן במיוחד).","התוצאות: כוויות ברקמות פנימיות, התכווצויות שרירים חזקות, הפסקת פעילות הלב והנשימה.","עכבת הגוף (ל-95% מהאוכלוסייה, 230V): כ-1,900 אוהם ביובש וכ-1,500 אוהם בהזעה. עכבה נמוכה יותר פירושה זרם גבוה יותר.","לפי IEC 60479: מעל כ-30mA מתחיל סיכון לפרפור חדרים, וככל שהזרם נמשך זמן רב יותר הסיכון עולה."], img:[["iec_curve","השפעת זרם החילופין על הגוף לפי עוצמה ומשך (IEC 60479). אזור 4: סיכון לפרפור חדרים"]]},
 {h:"מתח מגע ומתח צעד", b:["<b>מתח מגע:</b> המתח בין נקודת המגע של אדם בגוף מתכתי מחושמל לבין נקודת העמידה שלו.","<b>מתח צעד:</b> המתח בין שתי הרגליים כשאדם עומד סמוך לאזור מחושמל, למשל ליד כבל מ\"ג שנפל או שנאי פגוע.","הסכנה תלויה בעוצמת הזרם, צורת הגל, שיטת הארקת הרשת, סוג הקרקע, משך הזמן ומסלול הזרם."], svg:"step", img:[["touch_step","מתח מגע ומתח צעד ליד מבנה שנפגע מתקלה"]], c:"<b>כבל מ\"ג קרוע, משאית שפגעה בכבל או שנאי בוער:</b> להתרחק לפחות 10 מטר בקפיצות קטנות ברגליים צמודות או בצעדים קצרים מאוד, להרחיק אנשים ולהזעיק עזרה."},
 {h:"צמצום הסיכון", b:["לעבוד לפי פרק העבודה במתקן חי ובקרבתו בתקנות החשמל, ולפי תוכנית עבודה כתובה.","עבודת חשמל מבוצעת רק בידי חשמלאים בהתאם לרישיון.","לעבוד לפי הנהלים: מ\"ג, מ\"נ, מתקנים חיים, נעילה ותיוג, עבודה בגובה.","להכיר את מיקום מוט החילוץ ואת לחצני החירום להפסקת הזינה.","להשתמש בציוד מגן אישי מתאים."]},
 {h:"מה עושים כשאדם מתחשמל", steps:["לא לגעת בנפגע בידיים חשופות.","להפסיק מיד את אספקת החשמל (לחצן חירום, מפסק).","אם אי אפשר להפסיק, להפריד את הנפגע בעזרת מוט חילוץ או חפץ מבודד אחר. במ\"ג: לא להתקרב לפני ניתוק.","להזעיק עזרה רפואית (מד\"א 101) ולהודיע לממונים.","לבצע החייאה במידת הצורך, ולהשתמש בדפיברילטור אם יש."]}
]},
{t:"הכנה לעבודה ונעילה ותיוג", s:[
 {h:"טופס הכנה לביצוע עבודות חשמל", b:["לפני כל עבודה ממלאים טופס הכנה: מהות העבודה, המתקן, המבצעים והרישיונות שלהם.","מזהים את הסיכונים ואת אמצעי הבטיחות: ניתוק, נעילה, בדיקת העדר מתח, הארקה, ציוד מגן.","מגדירים את גבולות העבודה ואת האחראי, ומוודאים שכל הצוות מכיר את התוכנית."]},
 {h:"נעילה ותיוג (LOTO)", svg:"loto", img:[["loto1","מנעול אישי ותג אזהרה על נקודת הניתוק"]], b:["מטרה: למנוע הפעלה לא מתוכננת של מתקן או מכונה בזמן טיפול, ולמנוע שחרור אנרגיה אצורה.","הסיכון גבוה במיוחד כשכמה גורמים עובדים במתקן, בהחלפת משמרות, וכשיש יותר ממקור אנרגיה אחד (חשמל, לחץ אוויר, הידראוליקה).","על נקודת הניתוק שמים מנעול אישי ותג המזהה את העובד ואת העבודה.","כל עובד שם מנעול משלו, ורק הוא מסיר אותו."]},
 {h:"מה אומר החוק", b:["בישראל אין תקנות ייעודיות לנעילה ותיוג, אבל יש התייחסות בפקודת הבטיחות בעבודה ובתקנותיה.","תקנה 9 לתקנות הבטיחות בעבודה (חשמל), התש\"ן-1990: בעבודת תיקון ותחזוקה ינותק הציוד באמצעות מפסק, באופן גלוי לעין.","הניתוק יישמר בהתקן נעילה אמין בשליטת מבצע העבודה, והמפסק יסומן בשלט: \"אין להפעיל - המכונה בטיפול\".","אם הציוד אינו מאפשר נעילה, תופס המפעל חייב להבטיח באופן אחר את הניתוק ואת אי החיבור מחדש עד סיום העבודה."], img:[["loto2","תג על מפסק נעול, ועמדת ציוד נעילה ותיוג"]]}
]},
{t:"עבודה במתקן חי ובקרבתו", s:[
 {h:"מתי מותר לעבוד במתקן חי", b:["עבודה במתקן חי מותרת רק כשהפסקת האספקה עלולה לגרום ל: סכנה לחיי אדם, שיבוש בתהליך ייצור הדורש אספקה רציפה, שיבוש בשירותים לציבור, או שיבוש באספקה של ספק שירות חיוני.","חריגים מותרים במתקן חי: החלפת מכשיר מדידה, אביזר פיקוד, הגנה או מיתוג במעגל פיקוד עד 10A, והחלפת מונה בתנאים מסוימים.","במתקנים רבים, ובמתקני רשות הספק, אין לבצע עבודה במתקן חי בלי היתר מיוחד."]},
 {h:"הרכב הצוות והאחראי", b:["עבודה במתקן חי נעשית בידי צוות חשמלאים. האחראי בעל רישיון המתאים לגודל המתקן, נוכח ומשגיח לכל אורך העבודה.","במתח נמוך לפחות שני חשמלאים, ו<b>במתח גבוה לפחות שלושה</b>, כולל האחראי.","ההוראות בכתב: במ\"נ עד 3x630A חשמלאי הנדסאי לפחות, מעל זה מהנדס. <b>במ\"ג חשמלאי מהנדס.</b>","האחראי מתעד את הסיבה לעבודה, מטרתה, חלוקת התפקידים, הסיכונים, אמצעי הבטיחות וגבולות העבודה, ומוודא שכולם הבינו ושעמדת העבודה יציבה ומאפשרת עבודה בשתי ידיים."]},
 {h:"אמצעי בטיחות", b:["בידוד חלקי המתקן שאינם בטיפול ובידוד הסביבה, באופן שלא יזוז באקראי.","תיחום אזור העבודה בסרטים ובשלטי אזהרה.","תאורה שמאפשרת לזהות צבעים.","ציוד וכלים מתאימים, וציוד מגן אישי לפי התוספת השנייה לתקנות.","ביגוד מכותנה או ביגוד מגן בפני קשת.","התקנה או הסרה של כיסוי מבודד שכרוכה בחדירה לתחום המתקן החי נעשית כעבודה במתקן חי, או אחרי הפסקת המתח."]},
 {h:"מרחקי עבודה: DL ו-DV", p:"DL הוא רדיוס תחום העבודה במתקן חי. DV הוא רדיוס תחום הקרבה. בין שניהם נמצא תחום העבודה בקרבת מתקן חי.", table:{head:["מתח נקוב (kV)","DL (ס\"מ)","DV (ס\"מ)","תחום הקרבה (ס\"מ)"],rows:[["עד 1","20","40","20-40"],["3.3","22","122","22-122"],["6.6","23","123","23-123"],["12.6","26","126","26-126"],["22","41","141","41-141"],["33","56","156","56-156"]]}, img:[["dvdl","תחום העבודה במתקן חי (DL) ותחום הקרבה (DV) סביב חלק חי"]], c:"מדידה במתקן חי במ\"ג: בידי חשמלאי טכנאי לפחות או חשמלאי מסויג, במכשיר תקני שתקינותו נבדקה לפני השימוש."}
]},
{t:"בטיחות בעבודה במתח גבוה", s:[
 {h:"עקרונות", b:["פעולות במתקן מ\"ג רק לבעל רישיון מסויג מ\"ג המותאם למתקן.","ניתוק, בדיקת העדר מתח, התקנת מקצרים וחיבור מחדש רק לפי פקמ\"ק המאושרת בידי מורשה בכיר.","העבודה לפי נוהל הפקמ\"ק ונהלי המ\"ג של המקום.","ריענון שנתי בבטיחות ותפעול מערכות מ\"ג."]},
 {h:"חמשת כללי הזהב לשחרור מתקן", svg:"gold", steps:["ניתוק מכל מקורות ההזנה, כולל הזנות גיבוי וגנרטורים.","אבטחה נגד חיבור חוזר: נעילה, תיוג והוצאת נתיכים.","בדיקת העדר מתח בטסטר מ\"ג תקין ומתאים למתח, בכל הפאזות.","הארקה וקיצור, משני צידי מקום העבודה ככל האפשר.","גידור וכיסוי של חלקים חיים סמוכים."], c:"בחשמול מחדש עובדים בסדר הפוך, ורק אחרי שכל העובדים יצאו מאזור העבודה וכל המקצרים הוסרו ונספרו."},
 {h:"לפני מיתוגים", b:["לוודא שהפקודה ברורה לכל המשתתפים.","לוודא שכולם יודעים היכן לחצני הפסקת החירום ומוט ההצלה.","לפרוס שטיח בידוד במקום העבודה או המיתוג.","לסמן בסרט סימון את האזורים שמחוץ לתחום העבודה ואזורים מסוכנים.","לבצע ניהול סיכונים במידת הצורך.","עבודה בגובה בחדר מ\"ג, גם אם אינה עבודת חשמל, מאושרת בידי מורשה בכיר."]}
]},
{t:"ציוד ואביזרי בטיחות למ\"ג", s:[
 {h:"הציוד הנדרש", img:[["hv_equip","טסטר מ\"ג, שטיח בידוד, כפפות Class 3-4, מוט חילוץ וערכת מקצרים"]], b:["<b>טסטר מ\"ג</b> המתאים לרמת המתח, נבדק לפני השימוש ובמידת הצורך גם אחריו.","<b>מוט חילוץ</b> להפרדת נפגע ממקור מתח.","<b>מקצרים למ\"ג</b> בחתך מתאים לזרם הקצר במתקן, ממוספרים.","<b>שטיח בידוד</b> לחדרי מ\"ג.","<b>כפפות מבודדות Class 3-4.</b>","ציוד מגן אישי: נעלי עבודה לחשמלאים, קסדה עם מגן פנים, משקפי מגן וביגוד מתאים."]},
 {h:"תקנים ובדיקות", table:{head:["ציוד","תקן מקובל","בדיקה"],rows:[["כפפות מבודדות","IEC 60903","חזותית וניפוח לפני כל שימוש. בדיקה דיאלקטרית תקופתית (בדרך כלל כל 6 חודשים)"],["טסטר מ\"ג","IEC 61243-1","בדיקה עצמית או על מקור ידוע לפני השימוש"],["מקצרים והארקות","IEC 61230","בדיקה חזותית של כבלים, מהדקים ותוקף"],["שטיח בידוד","IEC 61111","שלמות, ניקיון והתאמה לרמת המתח"],["ביגוד מגן בפני קשת","IEC 61482","תווית דירוג (ATPV / Class)"]]}, c:"ציוד פגום או שתוקף בדיקתו עבר יוצא משימוש מיד ומסומן."}
]},
{t:"תוכנית עבודה ופקודת מיתוג וקיצור", s:[
 {h:"פקמ\"ק: מטרה ואחריות", svg:"pkmk", b:["להגדיר בבירור את תחום העבודה, המורשים לבצע, אופן ביצוע הפעולות וסדרן.","מאושרת בידי חשמלאי מהנדס שמכיר את המתקן ואת הנהלים החלים עליו.","אין לחרוג מהכתוב בפקמ\"ק.","אם המצב בשטח לא תואם את הכתוב: <b>עוצרים</b> ופונים למורשה הבכיר החתום על הפקודה."]},
 {h:"מה הפקודה כוללת", b:["זמנים ותאריכי ביצוע","מטרות העבודה","גבולות אזור העבודה ותיחומו","שמות המורשים וטלפונים של הממונים","סדר הפעולות, שלב אחר שלב, עם סימון ביצוע לכל שלב"]},
 {h:"נקודות דגש", b:["מצב הסביבה: אוורור, תאורה, מזג אוויר, חומרים מסוכנים","חלקים חשופים וחיים, או כאלה שעלולים להפוך לחיים","גישה למתקן, עמדת עבודה יציבה, עבודה בגובה","מגבלות זמן","מעברים ותיחום, מחיצות ושילוט","בדיקת טסטר מ\"ג וציוד הבטיחות, וקיום מוט הצלה","מיקום התקנת המקצרים ומספורם","ציוד עזרה ראשונה ומכשירי קשר"]},
 {h:"נספחים מומלצים", b:["תרשים הזנה של קטע המתקן, כולל מפסקים, לוחות ואביזרים","רשימת מקרים ותגובות","אישור שחרור מתקן ממתח","ניהול סיכונים","רשימת כלי עבודה וציוד מגן אישי"]},
 {h:"תרגיל: סדר פעולות לשחרור תא", p:"לפניכם דוגמה כללית לסדר פעולות בפקמ\"ק לשחרור תא יציאה במ\"ג. הסדר בפועל נקבע בפקמ\"ק של המתקן.", steps:["תיאום עם הגורם המזין ועם האחראי, ובדיקת ציוד הבטיחות.","פתיחת מפסק העומס או המפסק של התא.","נעילה ותיוג של מנגנון ההפעלה.","בדיקת העדר מתח (מחווני מתח וטסטר מ\"ג).","סגירת מנתק ההארקה, והתקנת מקצרים ניידים לפי הצורך, עם רישום מספריהם.","תיחום, שילוט ומסירת המתקן לאחראי העבודה בחתימה."]}
]},
{t:"תפעול לוח SM6 (שניידר)", s:[
 {h:"הכרת הלוח", svg:"sm6line", b:["SM6 הוא לוח מ\"ג מודולרי מבודד אוויר, עד 24kV (וגרסה ל-36kV), הבנוי מתאים נפרדים.","<b>IM:</b> תא מפסק עומס (כניסה או יציאה של טבעת).","<b>QM:</b> תא מפסק עומס עם נתיכים, להגנת שנאי. שריפת נתיך מפעילה את פתיחת המפסק.","<b>DM1:</b> תא מפסק זרם (ממסר הגנה) עם מנתק.","בכל תא: תרשים מימיק בחזית, מחווני נוכחות מתח (VPIS), פתחי הפעלה לידית ומקומות לתליית מנעול."]},
 {h:"מפסק העומס: שלושה מצבים", b:["מפסק העומס בתא IM נמצא במעטפת SF6 ויש לו שלושה מצבים: <b>סגור, פתוח ומוארק</b>.","מעבר בין המצבים נעשה בידית הפעלה, בפתחים נפרדים למפסק ולמנתק ההארקה.","המצב נראה במימיק ובמחוון המכני בחזית התא."], svg:"sw3"},
 {h:"נעילות מכניות", svg:"sm6front", b:["אי אפשר לסגור את מנתק ההארקה כשמפסק העומס סגור.","אי אפשר לסגור את מפסק העומס כשמנתק ההארקה סגור.","את מכסה תא הכבלים אפשר לפתוח רק אחרי סגירת מנתק ההארקה.","אי אפשר לפתוח את מנתק ההארקה כשמכסה תא הכבלים פתוח.","אפשר לתלות מנעול על פתחי ההפעלה, ולהתקין מנעולי מפתח (Key Interlock) בין תאים או מול השנאי."], c:"הנעילות המכניות הן שכבת הגנה, לא תחליף לבדיקת העדר מתח ולפקמ\"ק."},
 {h:"שחרור תא IM לעבודה", steps:["בדיקת הפקמ\"ק, ציוד מגן, שטיח בידוד וידית הפעלה מקורית.","פתיחת מפסק העומס ובדיקה במחוון שהוא פתוח.","בדיקת העדר מתח בכבלים במחווני VPIS, ואימות לפי הנוהל.","סגירת מנתק ההארקה.","נעילה ותיוג של פתחי ההפעלה.","פתיחת מכסה תא הכבלים, ובדיקת העדר מתח והתקנת מקצרים נוספים לפי הפקמ\"ק."]},

/* ---------- state ---------- */
let st = {ch:0, view:"slide", i:0, ans:{}, name:""};
try{ const s=JSON.parse(localStorage.getItem("hv-lomda")||"null"); if(s&&s.ans) st={...st,...s}; }catch(e){}
function save(){ try{localStorage.setItem("hv-lomda",JSON.stringify(st));}catch(e){} }
const order = {}; // shuffled option order per question
function ord(c,q){ const k=c+"-"+q; if(!order[k]){ const a=[0,1,2,3]; for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} order[k]=a;} return order[k]; }
const chDone = c => QS[c].every((_,q)=> st.ans[c+"-"+q]!==undefined);
const chScore = c => QS[c].filter((x,q)=> st.ans[c+"-"+q]===x.a).length;
const allDone = () => QS.every((_,c)=>chDone(c));
const total = () => QS.reduce((s,_,c)=>s+chScore(c),0);
const NQ = QS.reduce((s,c)=>s+c.length,0);
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ---------- rail ---------- */
function rail(){
  const r=document.getElementById("rail");
  r.innerHTML = CH.map((c,i)=>`<button data-c="${i}" class="${chDone(i)?"done":""}" aria-current="${st.view!=="final"&&st.ch===i}"><span class="num">${i+1}</span><span class="lbl">${esc(c.t)}</span>${chDone(i)?`<span class="score">${chScore(i)}/${QS[i].length}</span>`:""}</button>`).join("")
   + `<hr><button data-final="1" aria-current="${st.view==="final"}"><span class="num">✓</span><span class="lbl">ציון גמר ותעודה</span></button>`;
  r.querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>{st.ch=+b.dataset.c;st.view="slide";st.i=0;render();});
  r.querySelector("[data-final]").onclick=()=>{st.view="final";render();};
  const d=QS.filter((_,c)=>chDone(c)).length;
  document.getElementById("ovtxt").textContent=`התקדמות: ${d} מתוך 9 פרקים`;
  document.getElementById("ovbar").style.width=(d/9*100)+"%";
}

/* ---------- views ---------- */
function slideHTML(s){
  let h=`<h3>${s.h}</h3>`;
  if(s.p) h+=`<p>${s.p}</p>`;
  if(s.b) h+=`<ul>${s.b.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(s.steps) h+=`<ul class="steps">${s.steps.map(x=>`<li><span>${x}</span></li>`).join("")}</ul>`;
  if(s.table) h+=`<div class="tbl"><table><thead><tr>${s.table.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${s.table.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(s.c) h+=`<div class="callout">${s.c}</div>`;
  const figs=[].concat(s.svg||[]).map(k=>`<figure class="fig"><div class="svgbox">${SVGS[k]}</div>${CAP[k]?`<figcaption>${CAP[k]}</figcaption>`:""}</figure>`)
   .concat([].concat(s.img||[]).map(([k,cap])=>`<figure class="fig"><img src="${IMGS[k]}" alt="${esc(cap)}" loading="lazy"><figcaption>${cap}</figcaption></figure>`));
  if(figs.length) h=`<div class="split has-fig"><div>${h}</div><div style="display:grid;gap:14px;min-width:0">${figs.join("")}</div></div>`;
  if(s.links) h+=`<ul class="links" style="margin-top:14px">${s.links.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join("")}</ul>`;
  return h;
}
function head(eyebrow,title,count){ return `<div class="stage-head"><div class="grow"><div class="eyebrow">${eyebrow}</div><h2>${esc(title)}</h2></div><div class="count">${count||""}</div></div>`; }

function render(){
  rail(); save();
  const S=document.getElementById("stage");
  if(st.view==="final") return renderFinal(S);
  const c=CH[st.ch], n=c.s.length;
  if(st.view==="slide"){
    const s=c.s[st.i];
    S.innerHTML = head(`פרק ${st.ch+1} מתוך 9`, c.t, `שקף ${st.i+1} מתוך ${n}`)
     + `<div class="slide">${slideHTML(s)}</div>`
     + `<div class="foot"><button class="btn ghost" id="prev" ${st.ch===0&&st.i===0?"disabled":""}>הקודם</button><div class="dots">${c.s.map((_,k)=>`<i class="${k<=st.i?"on":""}"></i>`).join("")}<i style="background:none;border:1.5px solid var(--accent)"></i></div><button class="btn" id="next">${st.i<n-1?"הבא":"לבוחן הפרק"}</button></div>`;
    S.querySelector("#prev").onclick=()=>{ if(st.i>0) st.i--; else if(st.ch>0){st.ch--; st.view="quiz"; st.i=QS[st.ch].length-1;} render(); };
    S.querySelector("#next").onclick=()=>{ if(st.i<n-1) st.i++; else {st.view="quiz"; st.i=0;} render(); };
    return;
  }
  if(st.view==="quiz"){
    const qs=QS[st.ch], q=qs[st.i], key=st.ch+"-"+st.i, chosen=st.ans[key], o=ord(st.ch,st.i), L=["א","ב","ג","ד"];
    let h = head(`בוחן · פרק ${st.ch+1}`, c.t, `שאלה ${st.i+1} מתוך ${qs.length}`) + `<div class="q"><div class="qn">בחרו את התשובה הנכונה</div><h3>${esc(q.q)}</h3><div class="opts" role="list">`;
    o.forEach((oi,pos)=>{ let cls=""; if(chosen!==undefined){ if(oi===q.a) cls="right"; else if(oi===chosen) cls="wrong"; }
      h+=`<button class="opt ${cls}" data-o="${oi}" role="listitem" ${chosen!==undefined?'aria-disabled="true"':''}><span class="k">${L[pos]}.</span><span>${esc(q.o[oi])}</span></button>`; });
    h+=`</div>`;
    if(chosen!==undefined){ const ok=chosen===q.a; h+=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"נכון.":"לא נכון."}</b> <span>${ok?"":"התשובה הנכונה: "+esc(q.o[q.a])+". "}${esc(q.e||"")}</span></div>`; }
    const last=st.i===qs.length-1;
    h+=`</div><div class="foot"><button class="btn ghost" id="prev">הקודם</button><span class="muted">${chosen===undefined?"":`נכונות בפרק: ${chScore(st.ch)}`}</span><button class="btn" id="next" ${chosen===undefined?"disabled":""}>${last?"סיכום הפרק":"השאלה הבאה"}</button></div>`;
    S.innerHTML=h;
    S.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(st.ans[key]!==undefined) return; st.ans[key]=+b.dataset.o; render(); });
    S.querySelector("#prev").onclick=()=>{ if(st.i>0) st.i--; else {st.view="slide"; st.i=c.s.length-1;} render(); };
    S.querySelector("#next").onclick=()=>{ if(!last) st.i++; else st.view="sum"; render(); };
    return;
  }
  if(st.view==="sum"){
    const sc=chScore(st.ch), nq=QS[st.ch].length, lastCh=st.ch===8;
    S.innerHTML = head(`סיכום · פרק ${st.ch+1}`, c.t) + `<div class="center"><div class="big">${sc}/${nq}</div><div>${sc===nq?"כל התשובות נכונות.":sc>=nq*0.75?"עבודה טובה. כדאי לעבור שוב על השאלות שטעיתם בהן.":"מומלץ לחזור על החומר ולנסות שוב."}</div><div class="row"><button class="btn ghost" id="redo">חזרה על הבוחן</button><button class="btn" id="go">${lastCh?"לציון הגמר":"לפרק הבא"}</button></div></div>`;
    S.querySelector("#redo").onclick=()=>{ QS[st.ch].forEach((_,q)=>{delete st.ans[st.ch+"-"+q]; delete order[st.ch+"-"+q];}); st.view="quiz"; st.i=0; render(); };
    S.querySelector("#go").onclick=()=>{ if(lastCh) st.view="final"; else {st.ch++; st.view="slide"; st.i=0;} render(); };
  }
}

function renderFinal(S){
  const done=allDone(), sc=total(), pct=Math.round(sc/NQ*100), pass=pct>=PASS;
  let h=head("סיום","ציון גמר ותעודה");
  h+=`<div class="center"><div class="grid9">${CH.map((c,i)=>`<div><span>${i+1}. ${esc(c.t)}</span><b>${chDone(i)?chScore(i)+"/"+QS[i].length:"—"}</b></div>`).join("")}</div>`;
  if(!done){ h+=`<p>כדי לקבל ציון גמר צריך להשלים את הבוחן בכל 9 הפרקים. נותרו ${QS.filter((_,c)=>!chDone(c)).length} פרקים.</p></div>`; S.innerHTML=h; return; }
  h+=`<div class="big">${pct}%</div><div>${sc} תשובות נכונות מתוך ${NQ}. ציון עובר: ${PASS}%.</div>`;
  if(!pass){ h+=`<p>הציון נמוך מציון המעבר. חזרו על הפרקים שבהם טעיתם ונסו שוב את הבוחן שלהם.</p><button class="btn ghost" id="reset">התחלה מחדש של כל הבחנים</button></div>`; S.innerHTML=h; S.querySelector("#reset").onclick=resetAll; return; }
  h+=`<label for="nm">שם מלא לתעודה</label><input type="text" id="nm" value="${esc(st.name)}" placeholder="שם פרטי ושם משפחה" autocomplete="name">
      <canvas id="cert" width="1600" height="1131" aria-label="תעודת סיום"></canvas>
      <div class="row"><button class="btn" id="pdf">הורדת התעודה כ-PDF להדפסה</button><button class="btn ghost" id="png">הורדה כתמונה</button><button class="btn ghost" id="reset">התחלה מחדש</button></div>
      <div class="muted" id="msg"></div></div>`;
  S.innerHTML=h;
  const nm=S.querySelector("#nm"); nm.oninput=()=>{st.name=nm.value; save(); draw(pct,sc);};
  S.querySelector("#reset").onclick=resetAll;
  S.querySelector("#pdf").onclick=()=>dl("pdf"); S.querySelector("#png").onclick=()=>dl("png");
  document.fonts.load("700 40px Rubik").then(()=>document.fonts.load("400 30px Heebo")).finally(()=>draw(pct,sc));
  draw(pct,sc);
}
function resetAll(){ const n=st.name; st={ch:0,view:"slide",i:0,ans:{},name:n}; for(const k in order) delete order[k]; render(); }

function draw(pct,sc){
  const cv=document.getElementById("cert"); if(!cv) return; const x=cv.getContext("2d"), W=1600, H=1131;
  x.fillStyle="#fff"; x.fillRect(0,0,W,H);
  x.strokeStyle="#1f3a56"; x.lineWidth=14; x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle="#e8a200"; x.lineWidth=4; x.strokeRect(70,70,W-140,H-140);
  // warning sign
  x.save(); x.translate(W/2,190); x.fillStyle="#e8a200"; x.strokeStyle="#15202b"; x.lineWidth=6; x.beginPath(); x.moveTo(0,-70); x.lineTo(70,52); x.lineTo(-70,52); x.closePath(); x.fill(); x.stroke();
  x.fillStyle="#15202b"; x.beginPath(); x.moveTo(8,-38); x.lineTo(-18,8); x.lineTo(2,8); x.lineTo(-8,42); x.lineTo(22,-6); x.lineTo(2,-6); x.closePath(); x.fill(); x.restore();
  x.direction="rtl"; x.textAlign="center"; x.fillStyle="#15202b";
  x.font="800 92px Rubik, Heebo, sans-serif"; x.fillText("תעודת סיום",W/2,360);
  x.font="400 38px Heebo, sans-serif"; x.fillStyle="#566373"; x.fillText("מוענקת בזאת ל",W/2,450);
  x.fillStyle="#1f3a56"; x.font="700 76px Rubik, Heebo, sans-serif"; x.fillText((st.name||"").trim()||"__________________",W/2,545);
  x.strokeStyle="#e8a200"; x.lineWidth=3; x.beginPath(); x.moveTo(W/2-360,575); x.lineTo(W/2+360,575); x.stroke();
  x.fillStyle="#15202b"; x.font="400 40px Heebo, sans-serif";
  x.fillText("על השלמת לומדת ריענון בטיחות בחשמל",W/2,660);
  x.fillText("במתח נמוך ובמתח גבוה, כולל תפעול לוחות מתח גבוה",W/2,715);
  x.font="700 64px Rubik, Heebo, sans-serif"; x.fillStyle="#1f7a4a"; x.fillText(`ציון גמר: ${pct}%`,W/2,830);
  x.font="400 30px Heebo, sans-serif"; x.fillStyle="#566373"; x.fillText(`${sc} תשובות נכונות מתוך ${NQ}`,W/2,880);
  const d=new Date(); x.font="400 32px Heebo, sans-serif"; x.fillStyle="#15202b";
  x.textAlign="right"; x.fillText("תאריך: "+d.toLocaleDateString("he-IL"),W-160,1000);
  x.textAlign="left"; x.fillText("חתימת המדריך: ______________",160,1000);
}
async function dl(kind){
  const msg=document.getElementById("msg"), cv=document.getElementById("cert");
  if(!(st.name||"").trim()){ msg.textContent="כתבו שם מלא לפני ההורדה."; document.getElementById("nm").focus(); return; }
  const fname="תעודת סיום - "+st.name.trim();
  const dlc = window.claude ? await window.claude.use("downloads") : null;
  const blob = await new Promise(r=>{
    if(kind==="png") return cv.toBlob(r,"image/png");
    try{ const pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"}); pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,297,210); r(pdf.output("blob")); }catch(e){ r(null); }
  });
  if(!blob){ msg.textContent="יצירת הקובץ נכשלה. נסו את ההורדה כתמונה."; return; }
  if(!dlc){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname+"."+kind; document.body.appendChild(a); a.click(); a.remove(); msg.textContent="התעודה הורדה. פתחו אותה והדפיסו."; return; }
  try{ await dlc.save({filename:fname+"."+kind,data:blob}); msg.textContent="התעודה נשמרה. פתחו אותה והדפיסו."; }
  catch(e){ msg.textContent = e&&e.code==="declined" ? "ההורדה בוטלה." : "ההורדה לא הצליחה כאן. אפשר ללחוץ לחיצה ימנית על התעודה ולשמור אותה כתמונה."; }
}
render();
</script>
